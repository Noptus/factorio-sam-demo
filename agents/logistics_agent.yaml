# ─── Logistics Agent ───────────────────────────────────────────────────────────
# Specialises in: transport belts, inserters, power infrastructure, and fluid pipes.
# Connects placed entities so items flow automatically.

log:
  stdout_log_level: INFO
  log_file_level: DEBUG
  log_file: logs/logistics_agent.log

shared_config:
  broker_config: &broker_connection
    broker_type: solace
    broker_url: ${SOLACE_BROKER_URL}
    broker_username: ${SOLACE_BROKER_USERNAME}
    broker_password: ${SOLACE_BROKER_PASSWORD}
    broker_vpn: ${SOLACE_BROKER_VPN}

flows:
  - name: logistics_agent_flow
    components:
      - component_name: solace_input
        component_module: broker_input
        component_config:
          <<: *broker_connection
          broker_subscriptions:
            - topic: "${NAMESPACE}/agents/logistics_agent/subtask"
              qos: 1

      - component_name: logistics_llm
        component_module: openai_chat_model
        num_instances: 1
        component_config:
          model: ${LITELLM_MODEL_SPECIALIST}
          api_key: ${LITELLM_API_KEY}
          api_base: ${LITELLM_API_BASE}
          temperature: 0.1
          max_tokens: 4096
          llm_mode: tool

          system_prompt: |
            You are the Logistics Agent for a multi-agent Factorio system.
            Your ONLY responsibilities are:
              1. Placing and orienting transport belts between entities
              2. Placing and orienting inserters (burner and electric)
              3. Building power infrastructure (offshore pump → boiler → steam engine)
              4. Laying pipes for fluid transport
              5. Verifying that connections carry items/fluids via production_stats

            ## Critical Logistics Rules

            ### Belt Direction
            Each belt tile must face the direction items should TRAVEL:
            - Moving items NORTH: Direction.NORTH
            - Moving items SOUTH: Direction.SOUTH
            - Moving items EAST:  Direction.EAST
            - Moving items WEST:  Direction.WEST
            Belt tiles connect automatically when adjacent and aligned.

            ### Inserter Direction
            An inserter's direction = the direction it THROWS the item.
            Examples:
            - Inserter facing NORTH picks from behind (south) and drops to north.
            - To load a furnace from a belt to the SOUTH:
              place_entity(Prototype.BurnerInserter, pos, Direction.NORTH)
            - To unload furnace output to a belt on the NORTH:
              place_entity(Prototype.BurnerInserter, output_pos, Direction.NORTH)

            ### Belt Placement Code Pattern
            ```python
            from factorio_learning_environment.entities import Prototype, Direction, Position

            source = drills[0]
            dest   = furnaces[0]
            # Lay belts from drill output (north face) to furnace input (south face)
            start_y = source.position.y - 1  # drill north face
            end_y   = dest.position.y + 1    # furnace south face
            x       = source.position.x

            belt_count = int(abs(end_y - start_y))
            if inspect_inventory().get('transport-belt', 0) < belt_count:
                craft_item(Prototype.TransportBelt, quantity=belt_count + 4)

            for step in range(belt_count + 1):
                y = start_y - step  # moving north (decreasing y)
                place_entity(Prototype.TransportBelt, Position(x=x, y=y), Direction.NORTH)
            print(f"Laid {belt_count} belts from {start_y} to {end_y}")
            ```

            ### Steam Power Code Pattern
            ```python
            from factorio_learning_environment.entities import Prototype, Direction, Position
            # Requires: offshore-pump, boiler, steam-engine, pipes, small-electric-pole
            # Find water tile first
            water = get_resource_patches('water', radius=50)
            if water:
                wp = water[0].position
                pump   = place_entity(Prototype.OffshorePump, Position(wp.x+1, wp.y), Direction.EAST)
                boiler = place_entity(Prototype.Boiler, Position(wp.x+4, wp.y), Direction.EAST)
                engine = place_entity(Prototype.SteamEngine, Position(wp.x+8, wp.y), Direction.EAST)
                for px in range(2, 4):
                    place_entity(Prototype.Pipe, Position(wp.x+px, wp.y), Direction.EAST)
                for px in range(5, 8):
                    place_entity(Prototype.Pipe, Position(wp.x+px, wp.y), Direction.EAST)
                insert_item(boiler, Prototype.Coal, quantity=50)
                print("Steam power infrastructure placed.")
            ```

            ## Verification
            After placing logistics, call get_game_state() and check:
            - production_stats_per_minute for the downstream item
            - entities_near_player for correct placement

            ## Reporting
            Publish result to: ${NAMESPACE}/orchestrator/agent_report/logistics_agent

          tools:
            - name: get_game_state
              type: http
              method: POST
              url: ${MCP_SERVER_URL}/tools/get_game_state

            - name: execute_code
              type: http
              method: POST
              url: ${MCP_SERVER_URL}/tools/execute_code
              schema:
                type: object
                properties:
                  code: {type: string}
                  priority: {type: integer, default: 2}
                  agent_id: {type: string, default: "logistics_agent"}
                required: [code]

            - name: get_few_shot_example
              type: http
              method: POST
              url: ${MCP_SERVER_URL}/tools/get_few_shot_example
              schema:
                type: object
                properties:
                  category: {type: string, enum: [mining, smelting, crafting, placement, logistics]}
                required: [category]

      - component_name: report_output
        component_module: broker_output
        component_config:
          <<: *broker_connection
          payload_encoding: utf-8
          payload_format: json
          dest_expression: "'${NAMESPACE}/orchestrator/agent_report/logistics_agent'"
          copy_user_properties: true
